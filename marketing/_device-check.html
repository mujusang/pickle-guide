<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>device check</title>
<style>body{margin:0;background:#7a8790;font:12px sans-serif;padding:16px;display:flex;gap:16px;align-items:flex-start}
figure{margin:0}figcaption{color:#fff;padding:4px 0;font-weight:700}
.clip{width:390px;height:844px;overflow:hidden;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.35);position:relative;background:#fff}
.clip iframe{width:390px;height:12000px;border:0;display:block;position:absolute;left:0}
</style></head>
<body>
<figure><figcaption>390 · 첫 화면</figcaption><div class="clip"><iframe src="index.html" style="top:0"></iframe></div></figure>
<figure><figcaption>390 · offset 3950</figcaption><div class="clip"><iframe src="index.html" style="top:-3950px"></iframe></div></figure>
<figure><figcaption>390 · offset 8300</figcaption><div class="clip"><iframe src="index.html" style="top:-8300px"></iframe></div></figure>
</body></html>
