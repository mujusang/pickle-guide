<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>device check</title>
<style>
body{margin:0;background:#66727a;font:12px sans-serif;padding:14px}
.grid{display:grid;grid-template-columns:repeat(3,390px);gap:14px}
figure{margin:0;display:block}
figcaption{color:#fff;padding:4px 0;font-weight:700}
.clip{width:390px;height:844px;overflow:hidden;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.35);position:relative;background:#fff}
.clip iframe{width:390px;height:16000px;border:0;display:block;position:absolute;left:0;top:0}
</style></head>
<body>
<div class="grid">
<figure><figcaption>390 · 잠금 화면</figcaption><div class="clip"><iframe sandbox="allow-scripts allow-forms" src="index.html?v=5"></iframe></div></figure>
<figure><figcaption>390 · 첫 화면</figcaption><div class="clip"><iframe class="shot" src="index.html?v=5"></iframe></div></figure>
<figure><figcaption>390 · ① 남기기</figcaption><div class="clip"><iframe class="shot" data-target="#source" src="index.html?v=5"></iframe></div></figure>
<figure><figcaption>390 · ② 노션 표</figcaption><div class="clip"><iframe class="shot" data-target=".table-wrap" src="index.html?v=5"></iframe></div></figure>
<figure><figcaption>390 · ③ 4원칙</figcaption><div class="clip"><iframe class="shot" data-target="#channels .rules" src="index.html?v=5"></iframe></div></figure>
<figure><figcaption>390 · ④ 운영 루프</figcaption><div class="clip"><iframe class="shot" data-target="#loop" src="index.html?v=5"></iframe></div></figure>
<figure><figcaption>390 · ⑤ 체크리스트</figcaption><div class="clip"><iframe class="shot" data-target="#checklist" src="index.html?v=5"></iframe></div></figure>
<figure><figcaption>390 · 하단</figcaption><div class="clip"><iframe class="shot" data-target="footer" src="index.html?v=5"></iframe></div></figure>
</div>
<script>
document.querySelectorAll('iframe.shot[data-target]').forEach(function(fr){
  fr.addEventListener('load',function(){
    try{
      var el=fr.contentDocument.querySelector(fr.dataset.target);
      if(!el) return;
      var y=el.getBoundingClientRect().top+fr.contentWindow.scrollY-10;
      fr.style.top=(-Math.max(0,y))+'px';
    }catch(e){}
  });
});
</script>
</body></html>
