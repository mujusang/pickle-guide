<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>check</title>
<style>
body{margin:0;background:#66727a;font:12px sans-serif;padding:12px}
.g{display:grid;grid-template-columns:repeat(3,392px);gap:12px}
figure{margin:0}figcaption{color:#fff;padding:3px 0;font-weight:700}
.clip{width:390px;height:844px;overflow:hidden;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.35);position:relative;background:#fff}
.clip.wide{width:1280px;height:844px}
.clip iframe{width:390px;height:16000px;border:0;display:block;position:absolute;left:0;top:0}
.clip.wide iframe{width:1280px}
</style></head>
<body>
<div class="g">
<figure><figcaption>390 잠금</figcaption><div class="clip"><iframe sandbox="allow-scripts allow-forms" src="index.html?v=7"></iframe></div></figure>
<figure><figcaption>390 첫 화면</figcaption><div class="clip"><iframe class="s" src="index.html?v=7"></iframe></div></figure>
<figure><figcaption>390 ② 노션</figcaption><div class="clip"><iframe class="s" data-t="#notion" src="index.html?v=7"></iframe></div></figure>
<figure><figcaption>390 ③ 루프</figcaption><div class="clip"><iframe class="s" data-t="#loops" src="index.html?v=7"></iframe></div></figure>
<figure><figcaption>390 ⑤ 체크리스트</figcaption><div class="clip"><iframe class="s" data-t="#checklist" src="index.html?v=7"></iframe></div></figure>
<figure><figcaption>1280 첫 화면</figcaption><div class="clip wide"><iframe class="s" src="index.html?v=7"></iframe></div></figure>
</div>
<script>
document.querySelectorAll('iframe.s[data-t]').forEach(function(fr){
  fr.addEventListener('load',function(){
    try{var el=fr.contentDocument.querySelector(fr.dataset.t);
      if(el){fr.style.top=(-(el.getBoundingClientRect().top+fr.contentWindow.scrollY-8))+'px';}
      else{fr.style.top='0';}
    }catch(e){}
  });
});
</script>
</body></html>
